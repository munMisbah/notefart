name: Linux CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Versi binary yang dipaketkan
        value: ${{ jobs.linux.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  linux:
    name: Format, test, and release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config

      - name: Load pinned Rust toolchain
        run: rustc --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run all target tests
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --locked --release --bin naf

      - name: Smoke test release CLI
        run: |
          target/release/naf --version
          target/release/naf --help

      - name: Package binary and notices
        id: package
        run: |
          scripts/package.sh --binary target/release/naf --output target/dist
          version=$(tar -xOzf target/dist/naf-linux-x86_64.tar.gz naf-linux-x86_64/VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Audit release package
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          python3 scripts/audit-package.py \
            --archive target/dist/naf-linux-x86_64.tar.gz \
            --checksum target/dist/naf-linux-x86_64.tar.gz.sha256 \
            --expected-version "$PACKAGE_VERSION"

      - name: Smoke test installer
        run: |
          smoke=$(mktemp -d)
          trap 'rm -rf -- "$smoke"' EXIT
          export HOME="$smoke/home" XDG_CONFIG_HOME="$smoke/config"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$smoke/extracted"
          tar -xzf target/dist/naf-linux-x86_64.tar.gz -C "$smoke/extracted"
          cd "$smoke"
          "$smoke/extracted/naf-linux-x86_64/install.sh" --prefix "$smoke/prefix with spaces" --theme light --color 16 --icons ascii --clipboard internal
          "$smoke/prefix with spaces/bin/naf" --version
          config="$XDG_CONFIG_HOME/notefart/config.toml"
          grep -Fx 'theme = "light"' "$config"
          grep -Fx 'color = "16"' "$config"
          grep -Fx 'icons = "ascii"' "$config"
          grep -Fx 'clipboard = "internal"' "$config"
          cp "$config" "$smoke/validate.toml"
          "$smoke/prefix with spaces/bin/naf" --config "$smoke/validate.toml" --save-config
          printf '\n# Preferensi pengguna dipertahankan.\n' >> "$config"
          cp "$config" "$smoke/original.toml"
          "$smoke/extracted/naf-linux-x86_64/install.sh" --prefix "$smoke/prefix with spaces" --theme dark --color auto --icons unicode --clipboard auto
          cmp "$smoke/original.toml" "$config"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: naf-linux-x86_64-${{ github.sha }}
          path: |
            target/dist/naf-linux-x86_64.tar.gz
            target/dist/naf-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
