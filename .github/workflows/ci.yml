name: Linux CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  linux:
    name: Format, test, and release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config

      - name: Load pinned Rust toolchain
        run: rustc --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run all target tests
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --locked --release --bin naf

      - name: Smoke test release CLI
        run: |
          target/release/naf --version
          target/release/naf --help

      - name: Package binary and notices
        run: |
          mkdir -p target/dist/naf-linux-x86_64/licenses
          install -m 755 target/release/naf target/dist/naf-linux-x86_64/naf
          install -m 644 config.toml.example target/dist/naf-linux-x86_64/config.toml.example
          install -m 644 assets/licenses/Oniguruma.txt target/dist/naf-linux-x86_64/licenses/Oniguruma.txt
          install -m 644 assets/syntaxes/LICENSE target/dist/naf-linux-x86_64/licenses/Sublime-Packages.txt
          tar -czf target/dist/naf-linux-x86_64.tar.gz -C target/dist naf-linux-x86_64

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: naf-linux-x86_64-${{ github.sha }}
          path: target/dist/naf-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
